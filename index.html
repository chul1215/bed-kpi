<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선메디컬센터 병상가동률 개선 KPI 산출 시뮬레이터</title>
<style>
:root{
  --dj:#3b82f6;--ys:#10b981;
  --gold:#f59e0b;--red:#f87171;--green:#34d399;--purple:#a78bfa;--indigo:#818cf8;
  --bg:#07090f;--card:#0e1118;--card2:#111620;
  --border:#1a2235;--text:#e8eef8;--muted:#4a5568;--sub:#8899aa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
.nav{position:sticky;top:0;z-index:200;background:rgba(7,9,15,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:4px;}
.nav-logo{font-size:13px;font-weight:900;padding:14px 16px 14px 0;background:linear-gradient(90deg,var(--dj),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
.hosp-btn{padding:14px 18px;font-size:13px;font-weight:700;color:var(--sub);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.hosp-btn.dj.active{color:var(--dj);border-bottom-color:var(--dj);}
.hosp-btn.ys.active{color:var(--ys);border-bottom-color:var(--ys);}
.panel{display:none;padding:32px 28px;}
.panel.active{display:block;}
.sum-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.sum-card{flex:1;min-width:155px;background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--border);position:relative;overflow:hidden;}
.sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.sum-card.dj::before{background:linear-gradient(90deg,var(--dj),#6366f1);}
.sum-card.ys::before{background:linear-gradient(90deg,var(--ys),#06b6d4);}
.sum-card.off::before{background:linear-gradient(90deg,var(--indigo),#8b5cf6);}
.sum-card.norm::before{background:linear-gradient(90deg,var(--gold),#fb923c);}
.sum-card.hira::before{background:linear-gradient(90deg,var(--green),#06b6d4);}
.sum-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.sum-val{font-size:20px;font-weight:800;margin-bottom:3px;}
.sum-sub{font-size:11px;color:var(--sub);line-height:1.6;}
.sum-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:5px;}
.tag-off{background:rgba(129,140,248,0.2);color:var(--indigo);}
.tag-norm{background:rgba(245,158,11,0.15);color:var(--gold);}
.tag-hira{background:rgba(52,211,153,0.15);color:var(--green);}
.notice{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.18);border-radius:10px;padding:11px 15px;margin-bottom:18px;font-size:12px;color:var(--sub);line-height:1.8;}
.notice strong{color:var(--gold);}
.ctrl-row{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.ctrl-sel{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:8px;font-size:13px;cursor:pointer;outline:none;}
.ctrl-inp{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:8px;font-size:13px;outline:none;min-width:170px;}
.ctrl-inp::placeholder{color:var(--muted);}
.tgl{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.tgl-btn{padding:6px 11px;font-size:12px;font-weight:600;color:var(--sub);border:none;background:none;cursor:pointer;transition:all .15s;}
.tgl-btn.on{color:#fff;}
.tgl-btn.on.dj{background:var(--dj);}
.tgl-btn.on.ys{background:var(--ys);}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;}
.chip{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border);}
.leg-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);}
.leg-dot{width:7px;height:7px;border-radius:50%;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;}
table{width:100%;border-collapse:collapse;min-width:900px;}
thead th{background:var(--card2);padding:9px 11px;font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--sub);text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text);}
thead th.asc::after{content:" ▲";color:var(--gold);}
thead th.desc::after{content:" ▼";color:var(--gold);}
td{padding:9px 11px;font-size:12px;border-bottom:1px solid var(--border);text-align:center;background:var(--card);vertical-align:middle;}
tbody tr:hover td{background:var(--card2);}
tbody tr:last-child td{border-bottom:none;}
td.left{text-align:left;}th.left{text-align:left;}
.pcell{display:flex;flex-direction:column;gap:3px;align-items:center;}
.prow{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.pl{font-size:10px;color:var(--muted);width:22px;text-align:right;flex-shrink:0;}
.pc{font-size:11px;color:var(--sub);}
.pa{font-size:10px;color:var(--muted);}
.pt-off{font-size:12px;font-weight:700;color:var(--indigo);}
.pt-norm{font-size:12px;font-weight:700;color:var(--gold);}
.pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap;}
.p-neg{background:rgba(248,113,113,0.15);color:var(--red);}
.p-pos{background:rgba(52,211,153,0.15);color:var(--green);}
.p-zero{background:rgba(139,92,246,0.15);color:var(--purple);}
.bar-wrap{display:inline-block;width:58px;vertical-align:middle;}
.bar-bg{background:var(--border);border-radius:3px;height:4px;margin-top:2px;}
.bar-fill{height:100%;border-radius:3px;}
.hv{color:var(--green);font-weight:700;}
.hna{color:var(--muted);font-size:11px;}
.vo{color:var(--red);font-size:11px;}
.vu{color:var(--green);font-size:11px;}
.pagi{display:flex;justify-content:center;align-items:center;gap:5px;padding-top:6px;}
.pg-btn{background:var(--card2);border:1px solid var(--border);color:var(--sub);padding:5px 10px;border-radius:5px;font-size:11px;cursor:pointer;}
.pg-btn:hover,.pg-btn.act{background:var(--dj);color:#fff;border-color:var(--dj);}
.pg-info{font-size:11px;color:var(--muted);padding:0 5px;}
.sec{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}
.no-data{text-align:center;padding:32px;color:var(--muted);}
</style>
</head>

</nav>

  <div class="leg-row">
    <div class="leg-item"><div class="leg-dot" style="background:var(--sub)"></div>현재 재원일수</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--indigo)"></div>비수기 목표(85%)</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--gold)"></div>통상기간 목표(90%)</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>심평원</div>
    <div class="leg-item"><span class="pill p-neg" style="font-size:10px;">−X.X일 줄여야 함</span></div>
    <div class="leg-item"><span class="pill p-pos" style="font-size:10px;">+X.X일 늘려야 함</span></div>
  </div>

  <div class="tbl-wrap">
    <table id="tbl-${h}">
      <thead><tr>
        <th class="left" onclick="ds('${h}',0)">의사명</th>
        <th class="left" onclick="ds('${h}',1)">진단명</th>
        <th onclick="ds('${h}',2)">환자수</th>
        <th onclick="ds('${h}',3)">비수기 목표 <span style="font-weight:400;color:var(--indigo)">(85%)</span><br><span style="font-size:9px;color:var(--muted)">3·4·11·12월</span></th>
        <th onclick="ds('${h}',4)">통상기간 목표 <span style="font-weight:400;color:var(--gold)">(90%)</span><br><span style="font-size:9px;color:var(--muted)">1·2·5·6·7·8·9·10월</span></th>
        <th onclick="ds('${h}',5)">연간목표 <span style="font-weight:400;color:${col}">(${s.tgt_occ}%)</span><br><span style="font-size:9px;color:var(--muted)">연간기준</span></th>
        <th onclick="ds('${h}',6)">심평원</th>
        <th onclick="ds('${h}',7)">vs 심평원</th>
      </tr></thead>
      <tbody id="tbody-${h}"></tbody>
    </table>
  </div>
  <div class="pagi" id="pagi-${h}"></div>`;

  const sel=document.getElementById('sel-'+h);
  const docDept=SUM[h].doc_dept||{};
  const deptMap={};
  [...new Set(DATA[h].map(r=>r.doctor))].forEach(d=>{
    const dept=docDept[d]||'기타';
    if(!deptMap[dept]) deptMap[dept]=[];
    deptMap[dept].push(d);
  });
  Object.keys(deptMap).sort().forEach(dept=>{
    const grp=document.createElement('optgroup');
    grp.label=dept;
    deptMap[dept].sort().forEach(d=>{
      const o=document.createElement('option');
      o.value=d; o.textContent=d;
      grp.appendChild(o);
    });
    sel.appendChild(grp);
  });
  window['mode_'+h]='all';
  af(h);
}

function sm(h,m){
  window['mode_'+h]=m;
  document.querySelectorAll('#tgl-'+h+' .tgl-btn').forEach((b,i)=>b.classList.toggle('on',['all','need','hira'][i]===m));
  af(h);
}

function af(h){
  const doc=document.getElementById('sel-'+h)?.value||'';
  const q=(document.getElementById('inp-'+h)?.value||'').toLowerCase();
  const mode=window['mode_'+h]||'all';
  const s=SUM[h], dir=s.direction;
  let rows=[...DATA[h]];
  if(doc) rows=rows.filter(r=>r.doctor===doc);
  if(q)   rows=rows.filter(r=>r.diag.toLowerCase().includes(q)||r.doctor.toLowerCase().includes(q));
  if(mode==='need') rows=rows.filter(r=>
    dir==='단축'?(r.diff_off>0.05||r.diff_norm>0.05):(r.diff_off<-0.05||r.diff_norm<-0.05)
  );
  if(mode==='hira') rows=rows.filter(r=>r.hira!==null);

  if(sCol!==null){
    const keys=['doctor','diag','n','tgt_off','tgt_norm','cur','hira','vs_hira'];
    rows.sort((a,b)=>{
      let av=a[keys[sCol]]??( sDir>0?9999:-9999);
      let bv=b[keys[sCol]]??( sDir>0?9999:-9999);
      return typeof av==='string'?av.localeCompare(bv)*sDir:(av-bv)*sDir;
    });
  }
  filt=rows; curPg=1;

  const total=DATA[h].length;
  const dir2=s.direction;
  const needCnt=DATA[h].filter(r=>
    dir2==='단축'?(r.diff_off>0.05||r.diff_norm>0.05):(r.diff_off<-0.05||r.diff_norm<-0.05)
  ).length;
  const hiraCnt=DATA[h].filter(r=>r.hira!==null).length;
  const adjLbl=dir2==='단축'?'단축필요':'연장필요';
  const ct=document.getElementById('ct-'+h);
  const cd=document.getElementById('cd-'+h);
  const ch=document.getElementById('ch-'+h);
  if(ct) ct.textContent=`조정대상 ${total}건`;
  if(cd) cd.textContent=`${adjLbl} ${needCnt}건`;
  if(ch) ch.textContent=`심평원有 ${hiraCnt}건`;
  renderTbl(h);
}

// diff = 현재 - 목표  양수=줄여야(-표시/빨강) 음수=늘려야(+표시/초록)
function pillDiff(diff){
  if(Math.abs(diff)<=0.05) return '<span class="pill p-zero">±0</span>';
  if(diff>0) return `<span class="pill p-neg">−${diff.toFixed(1)}일</span>`;
  return `<span class="pill p-pos">+${Math.abs(diff).toFixed(1)}일</span>`;
}

function renderTbl(h){
  const col=h==='대전'?'#3b82f6':'#10b981';
  const s=SUM[h], dir=s.direction;
  const tbody=document.getElementById('tbody-'+h);
  if(!tbody) return;
  const tot=filt.length, rows=filt.slice((curPg-1)*PG, curPg*PG);
  const maxCur=Math.max(...DATA[h].map(r=>r.cur),1);

  if(!rows.length){tbody.innerHTML='<tr><td colspan="8" class="no-data">조건에 맞는 데이터가 없습니다</td></tr>';renderPagi(h,tot);return;}

  tbody.innerHTML=rows.map(r=>{
    const needAdj=dir==='단축'?(r.diff_off>0.05||r.diff_norm>0.05):(r.diff_off<-0.05||r.diff_norm<-0.05);
    const barCol=needAdj?(dir==='단축'?'var(--red)':'var(--green)'):col;
    const barPct=Math.min(100,(r.cur/maxCur)*100);

    const offCell=`<div class="pcell">
      <div class="prow">
        <span class="pl">현재</span><span class="pc">${r.cur_off.toFixed(1)}일</span>
        <span class="pa">→</span><span class="pt-off">${r.tgt_off.toFixed(1)}일</span>
      </div>
      <div>${pillDiff(r.diff_off)}&nbsp;<span style="font-size:10px;color:var(--muted)">${r.off_n}명</span></div>
    </div>`;

    const normCell=`<div class="pcell">
      <div class="prow">
        <span class="pl">현재</span><span class="pc">${r.cur_norm.toFixed(1)}일</span>
        <span class="pa">→</span><span class="pt-norm">${r.tgt_norm.toFixed(1)}일</span>
      </div>
      <div>${pillDiff(r.diff_norm)}&nbsp;<span style="font-size:10px;color:var(--muted)">${r.norm_n}명</span></div>
    </div>`;

    const annualRatio=window['annual_ratio_'+h]||1;
    const tgtAnnual=r.cur*annualRatio;
    const diffAnnual=parseFloat((r.cur-tgtAnnual).toFixed(1));
    const annualCell=`<div class="pcell">
      <div class="prow">
        <span class="pl">현재</span><span class="pc">${r.cur.toFixed(1)}일</span>
        <span class="pa">→</span><span class="pt-norm">${tgtAnnual.toFixed(1)}일</span>
      </div>
      <div>${pillDiff(diffAnnual)}&nbsp;<span style="font-size:10px;color:var(--muted)">${r.n}명</span></div>
    </div>`;

    const hiraHtml=r.hira!==null?`<span class="hv">${r.hira}일</span>`:`<span class="hna">—</span>`;
    let vsH='<span class="hna">—</span>';
    if(r.vs_hira!==null){
      const d=-r.vs_hira; // hira - cur: 심평원 도달을 위해 필요한 변화량
      const overhira=dir==='단축'?(r.vs_hira>0.05):(r.vs_hira<-0.05);
      const underhira=dir==='단축'?(r.vs_hira<-0.05):(r.vs_hira>0.05);
      if(overhira)       vsH=`<span class="vo">${d>0?'+':''}${d.toFixed(1)}일</span>`;
      else if(underhira) vsH=`<span class="vu">${d>0?'+':''}${d.toFixed(1)}일</span>`;
      else               vsH=`<span style="color:var(--muted);font-size:11px;">±0</span>`;
    }

    return `<tr>
      <td class="left" style="font-weight:700;white-space:nowrap;">${r.doctor}</td>
      <td class="left" style="color:var(--sub);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${r.diag}">${r.diag}</td>
      <td><b>${r.n}</b>명
        <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${barPct}%;background:${barCol}"></div></div></div>
      </td>
      <td>${offCell}</td>
      <td>${normCell}</td>
      <td>${annualCell}</td>
      <td>${hiraHtml}</td>
      <td>${vsH}</td>
    </tr>`;
  }).join('');
  renderPagi(h,tot);
}

function renderPagi(h,tot){
  const pagi=document.getElementById('pagi-'+h);
  if(!pagi) return;
  const tp=Math.ceil(tot/PG);
  if(tp<=1){pagi.innerHTML='';return;}
  let pages=[];
  for(let i=1;i<=tp;i++){
    if(i===1||i===tp||Math.abs(i-curPg)<=2) pages.push(i);
    else if(pages[pages.length-1]!=='…') pages.push('…');
  }
  const prev=curPg>1?`<button class="pg-btn" onclick="gp('${h}',${curPg-1})">◀</button>`:'';
  const next=curPg<tp?`<button class="pg-btn" onclick="gp('${h}',${curPg+1})">▶</button>`:'';
  pagi.innerHTML=prev+pages.map(p=>p==='…'?`<span class="pg-info">…</span>`
    :`<button class="pg-btn ${p===curPg?'act':''}" onclick="gp('${h}',${p})">${p}</button>`).join('')+next
    +`<span class="pg-info">${tot}건 / ${tp}페이지</span>`;
}

function gp(h,p){af(h);curPg=p;renderTbl(h);document.getElementById('tbl-'+h)?.scrollIntoView({behavior:'smooth',block:'nearest'});}
function ds(h,c){
  if(sCol===c) sDir*=-1; else{sCol=c;sDir=1;}
  document.querySelectorAll(`#tbl-${h} thead th`).forEach((th,i)=>{
    th.classList.remove('asc','desc');
    if(i===c) th.classList.add(sDir===1?'asc':'desc');
  });
  af(h);
}

render('대전'); render('유성');
document.getElementById('p-ys').classList.remove('active');
</script>
</body>
</html>
