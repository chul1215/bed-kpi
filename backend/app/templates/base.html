<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ==================== 색상 체계 ==================== */
        :root {
            --bg-dark: #292F36;      /* 다크 그레이 - 배경 */
            --accent: #4ECDC4;       /* 청록색 - 강조 */
            --white: #FFFFFF;        /* 화이트 - 텍스트/카드 */

            /* 파생 색상 */
            --bg-light: #353C44;     /* 밝은 배경 */
            --accent-hover: #3DB9B0; /* 강조색 호버 */
            --text-primary: #FFFFFF; /* 주요 텍스트 */
            --text-secondary: rgba(255, 255, 255, 0.7); /* 보조 텍스트 */
            --border: rgba(78, 205, 196, 0.2); /* 테두리 */

            /* 레이아웃 */
            --radius: 12px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* ==================== 전역 스타일 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==================== 헤더 ==================== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(41, 47, 54, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            color: var(--accent);
            font-size: 28px;
        }

        .header-controls {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ==================== 버튼 ==================== */
        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid var(--border);
            background-color: transparent;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .btn.active {
            background-color: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* ==================== 카드 ==================== */
        .card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            color: var(--accent);
            font-size: 20px;
        }

        /* ==================== KPI 카드 ==================== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
        }

        .kpi-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--white);
            font-family: 'Courier New', monospace;
        }

        .kpi-unit {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .kpi-change {
            font-size: 14px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .kpi-change.positive {
            color: var(--accent);
        }

        .kpi-change.negative {
            color: #FF6B6B;
        }

        /* ==================== 테이블 ==================== */
        .table-container {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 32px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-dark);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }

        th.text-end {
            text-align: right;
        }

        td {
            padding: 16px;
            font-size: 14px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
        }

        td.text-end {
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: rgba(78, 205, 196, 0.05);
        }

        /* ==================== 배지 ==================== */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            background: var(--accent);
            color: var(--bg-dark);
        }

        .badge.secondary {
            background: var(--text-secondary);
            color: var(--white);
        }

        /* ==================== 차트 컨테이너 ==================== */
        .chart-container {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 32px;
        }

        /* ==================== 반응형 ==================== */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }

        /* ==================== 유틸리티 ==================== */
        .text-accent {
            color: var(--accent);
        }

        .text-secondary {
            color: var(--text-secondary);
        }

        .mb-4 {
            margin-bottom: 32px;
        }

        .mt-4 {
            margin-top: 32px;
        }

        .gap-2 {
            gap: 16px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-title">
                    <i class="bi bi-hospital"></i>
                    선메디컬센터 병상가동 KPI
                </div>
                <div class="header-controls">
                    <!-- 병원 선택 -->
                    <div class="control-group">
                        <label>병원</label>
                        <button class="btn {% if hospital == '대전' %}active{% endif %}"
                                onclick="switchHospital('대전')">
                            대전선병원
                        </button>
                        <button class="btn {% if hospital == '유성' %}active{% endif %}"
                                onclick="switchHospital('유성')">
                            유성선병원
                        </button>
                    </div>

                    <!-- 기간 선택 -->
                    <div class="control-group">
                        <label>기간</label>
                        <button class="btn {% if period == 'off_season' %}active{% endif %}"
                                onclick="switchPeriod('off_season')">
                            비수기
                        </button>
                        <button class="btn {% if period == 'normal' %}active{% endif %}"
                                onclick="switchPeriod('normal')">
                            통상기간
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
        {% block content %}{% endblock %}
    </main>

    <!-- 스크립트 -->
    <script>
        // 병원 전환
        function switchHospital(hospital) {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('hospital', hospital);
            window.location.search = urlParams.toString();
        }

        // 기간 전환
        function switchPeriod(period) {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('period', period);
            window.location.search = urlParams.toString();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
